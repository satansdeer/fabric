[workspace]
members = [
    "crates/fabric-domain",
    "crates/fabric-store",
    "crates/fabric-project",
    "crates/fabric-workspace",
    "crates/fabric-runner",
    "crates/fabric-core",
    "crates/fabric-cli",
    "sdk/rust/reference-harnesses",
]
default-members = ["crates/fabric-cli"]
resolver = "3"

[workspace.package]
version = "0.1.20"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fabric-domain = { path = "crates/fabric-domain" }
fabric-core = { path = "crates/fabric-core" }
