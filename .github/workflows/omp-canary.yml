name: Daily upstream OMP compatibility canary

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: omp-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - run: node scripts/test-omp-canary.mjs

  canary:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - name: Authenticated downloads and isolated native up / typed tools (no inference)
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          export CANARY_BUN="$(command -v bun)"
          node scripts/omp-canary.mjs run "$RUNNER_TEMP/omp-canary-evidence"
      - name: Retain isolated identities, digests and probe logs, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omp-canary-evidence
          path: ${{ runner.temp }}/omp-canary-evidence/
          if-no-files-found: error
          retention-days: 30

  report:
    if: always() && github.ref == 'refs/heads/main' && needs.canary.result == 'failure'
    needs: canary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Retrieve evidence if setup/probe produced it
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: omp-canary-evidence
          path: evidence
      - name: Create or update bounded compatibility failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY_JOB_RESULT: ${{ needs.canary.result }}
        run: node scripts/omp-canary.mjs report evidence
