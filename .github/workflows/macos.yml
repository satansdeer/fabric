name: macOS acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      FABRIC_REFERENCE_PLUGIN_BINARY: ${{ github.workspace }}/target/release/fabric-reference-harnesses
      FABRIC_LOCAL_TARGET_BINARY: ${{ github.workspace }}/target/debug/fabric-local-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Pinned public native installer and optional launcher (provider-free)
        timeout-minutes: 5
        run: node scripts/test-distribution.mjs
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Formatting
        run: cargo fmt --all --check
      - name: Strict lint
        run: cargo clippy --offline --locked --workspace --all-targets -- -D warnings
      - name: Build actual Fabric binaries
        run: cargo build --offline --locked --bins
      - name: Build separately installed native reference plugins
        run: cargo build --offline --locked --release -p fabric-reference-harnesses --bin fabric-reference-harnesses
      - name: Workspace acceptance (local fake harnesses only)
        env:
          # Each case launches processes; bound suite-level runner contention.
          RUST_TEST_THREADS: "4"
        run: FABRIC_PLUGIN_TEST_NODE="$(command -v node)" cargo test --offline --locked --workspace
      - name: TypeScript SDK and generated plugins (provider-free)
        working-directory: sdk/typescript
        env:
          FABRIC_PLUGIN_TEST_HOST: ${{ github.workspace }}/target/debug/fabric
        run: |
          npm ci --ignore-scripts
          npm test
      - name: ACP transport and installed native bridge (provider-free)
        env:
          FABRIC_ACP_TEST_HOST: ${{ github.workspace }}/target/debug/fabric
        run: node --test plugins/acp/*.test.mjs
      - name: Scripted loopback model API (no external model provider)
        run: node scripts/test-scripted-provider.mjs
      - name: Generated TypeScript plugins through the native host (provider-free)
        run: FABRIC_PLUGIN_TEST_NODE="$(command -v node)" cargo test --offline --locked -p fabric-runner --test plugins typescript_scaffolds_use_existing_native_host
      - name: Issue-controlled local worker (provider-free)
        timeout-minutes: 5
        run: python3 scripts/test-fabric-issue.py --fabric "$GITHUB_WORKSPACE/target/debug/fabric"
      - name: Connect signed ingress and durable inbox (provider-free)
        run: node --test integrations/connect/service.test.mjs integrations/connect/generic.test.mjs
      - name: Cloudflare SQLite inbox (local workerd, provider-free)
        timeout-minutes: 5
        working-directory: integrations/connect/cloudflare
        run: |
          npm ci
          npm test
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/fabric-connect-cloudflare"
      - name: Connect application request headers (provider-free)
        run: python3 scripts/test-fabric-connect-request.py -v
      - name: Connect outbound local worker (provider-free)
        timeout-minutes: 5
        run: python3 scripts/test-fabric-connect.py --fabric "$GITHUB_WORKSPACE/target/debug/fabric"
      - name: Generic Connect crash and reconnect acceptance (provider-free)
        timeout-minutes: 5
        run: python3 scripts/test-fabric-connect-agent.py --fabric "$GITHUB_WORKSPACE/target/debug/fabric"
      - name: External GitHub connector and scoped responses (provider-free)
        timeout-minutes: 5
        run: python3 scripts/test-fabric-github.py --fabric "$GITHUB_WORKSPACE/target/debug/fabric"
      - name: External Kubernetes target boundaries (provider-free; no cluster access)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s plugins/kubernetes -p test_target.py
      - name: OMP v1 conformance (fake workers, provider-free)
        timeout-minutes: 5
        run: bun integrations/omp/conformance.ts "$GITHUB_WORKSPACE/target/debug/fabric"
      - name: OMP typed conformance (fake workers, provider-free)
        timeout-minutes: 5
        run: bun integrations/omp/typed-conformance.ts "$GITHUB_WORKSPACE/target/debug/fabric"
      - name: Checkout pinned public pstack plugin
        uses: actions/checkout@v4
        with:
          repository: satansdeer/om-pstack
          ref: 437dd8e4b2ec579202fce2e81ca0900765b16472
          path: .ci/pstack
          persist-credentials: false
      - name: Download and verify native OMP 19.1.1
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              platform=arm64
              sha256=d5a3324acd98375a01698a1b0c018be48caed2956c8aa9044ad137fe43bc0400
              ;;
            x86_64)
              platform=x64
              sha256=6ffecb22a9fe01a98f90f91a2ef04a697850a23bf4dde83adad2fe80e51a8353
              ;;
            *) echo "Unsupported native OMP architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl --fail --location --max-time 180 \
            "https://github.com/can1357/oh-my-pi/releases/download/v19.1.1/omp-darwin-$platform" \
            --output "$RUNNER_TEMP/omp-19.1.1"
          printf '%s  %s\n' "$sha256" "$RUNNER_TEMP/omp-19.1.1" | shasum -a 256 --check
          chmod 700 "$RUNNER_TEMP/omp-19.1.1"
      - name: Native OMP and pstack discovery (fake workers, provider-free; no model turn)
        timeout-minutes: 5
        run: >-
          bun integrations/omp/host-smoke.ts
          "$GITHUB_WORKSPACE/target/debug/fabric"
          "$RUNNER_TEMP/omp-19.1.1"
          "$GITHUB_WORKSPACE/.ci/pstack/omp"
      - name: Real native OMP with scripted local model API (no external model provider)
        timeout-minutes: 10
        run: >-
          bun integrations/omp/scripted-provider-smoke.mjs
          "$GITHUB_WORKSPACE/target/debug/fabric"
          "$RUNNER_TEMP/omp-19.1.1"
          "$GITHUB_WORKSPACE/target/release/fabric-reference-harnesses"
